<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C1428"/>
      <stop offset="1" stop-color="#090F1E"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#94A3B8" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="400" height="220" fill="url(#bg)"/>
  <rect width="400" height="220" fill="url(#dots)"/>

  <!-- центральный отчёт -->
  <g>
    <path d="M168 46 H224 L252 74 V166 Q252 172 246 172 H168 Q162 172 162 166 V52 Q162 46 168 46 Z" fill="#4D6BFE" opacity="0.14" stroke="#6D86FF" stroke-width="2" stroke-linejoin="round"/>
    <path d="M224 46 V74 H252" fill="none" stroke="#6D86FF" stroke-width="2" stroke-linejoin="round"/>
    <g stroke="#6D86FF" stroke-width="2" stroke-linecap="round" opacity="0.85">
      <path d="M174 92 H236"/>
      <path d="M174 108 H226"/>
      <path d="M174 124 H236"/>
      <path d="M174 140 H210"/>
    </g>
    <!-- метка PDF -->
    <rect x="220" y="146" width="26" height="16" rx="3" fill="#4D6BFE"/>
  </g>

  <!-- связи -->
  <g stroke="#4D6BFE" stroke-width="1.5" stroke-dasharray="3 4" opacity="0.7" fill="none">
    <path d="M162 100 H116"/>
    <path d="M252 84 L300 62"/>
    <path d="M252 140 L300 162"/>
  </g>

  <!-- база данных -->
  <g transform="translate(66 78)">
    <ellipse cx="24" cy="10" rx="24" ry="10" fill="#0C1428" stroke="#6D86FF" stroke-width="2"/>
    <path d="M0 10 V44 Q0 54 24 54 Q48 54 48 44 V10" fill="#4D6BFE" opacity="0.14" stroke="#6D86FF" stroke-width="2"/>
    <path d="M0 27 Q0 37 24 37 Q48 37 48 27" fill="none" stroke="#6D86FF" stroke-width="2"/>
  </g>

  <!-- роли: психолог и администратор -->
  <g stroke="#6D86FF" stroke-width="2" fill="#0C1428">
    <circle cx="316" cy="48" r="16"/>
    <circle cx="316" cy="164" r="16"/>
  </g>
  <g fill="#4D6BFE">
    <circle cx="316" cy="43" r="5"/>
    <path d="M307 57 Q316 48 325 57 Z"/>
    <circle cx="316" cy="159" r="5"/>
    <path d="M307 173 Q316 164 325 173 Z"/>
  </g>

  <!-- почтовый сервис -->
  <g transform="translate(300 96)">
    <rect x="0" y="0" width="32" height="22" rx="4" fill="#0C1428" stroke="#6D86FF" stroke-width="2"/>
    <path d="M2 3 L16 14 L30 3" fill="none" stroke="#6D86FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
