    <path d="M-7 -2 V-8 a7 7 0 0 1 14 0 V-2" fill="none" stroke="#6D86FF" stroke-width="2"/>
    <circle cx="0" cy="9" r="2.6" fill="#0C1428"/>
  </g>

  <!-- индикаторы статуса -->
  <circle cx="346" cy="62" r="4" fill="#4D6BFE"/>
  <circle cx="332" cy="62" r="4" fill="#4D6BFE" opacity="0.5"/>
  <circle cx="318" cy="62" r="4" fill="#4D6BFE" opacity="0.25"/>
</svg>
